name: Dependency Security Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Generate npm audit report
        id: npm-audit
        continue-on-error: true
        run: npm audit --json > npm-audit.json

      - name: Summarize vulnerabilities
        if: always()
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency vulnerability summary:');
          console.log(JSON.stringify(counts, null, 2));
          console.log('\nAffected packages:');
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (item.via ?? []).map((entry) =>
              typeof entry === 'string' ? entry : entry.title
            );
            console.log(
              `- ${name}: ${item.severity}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}; via=${via.join('; ')}`
            );
          }
          NODE

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
